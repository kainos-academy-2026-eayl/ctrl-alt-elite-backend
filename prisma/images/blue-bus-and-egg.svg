  <title id="title">A blue bus and an egg with a detailed face</title>
  <desc id="description">A glossy blue bus sits on a sunlit road beside a large ivory egg with expressive blue eyes, individually drawn eyebrows, a sculpted nose, rosy cheeks, and a smiling mouth.</desc>
