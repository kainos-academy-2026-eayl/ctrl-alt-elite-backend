name: Terraform infrastructure graph

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  generate-graph:
    name: Generate infrastructure graph
    runs-on: ubuntu-latest

    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-provider-cache

    permissions:
      contents: read

    outputs:
      artifact-url: ${{ steps.upload.outputs.artifact-url }}

    defaults:
      run:
        working-directory: my-infrastructure

    steps:
      - name: Check out pull request code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check YAML formatting
        working-directory: .
        run: npx --yes prettier@3.6.2 --check .github/workflows/terraform-graph.yml

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.17.1"
          terraform_wrapper: false

      - name: Create Terraform provider cache directory
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Restore Terraform provider cache
        uses: actions/cache@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: terraform-providers-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('my-infrastructure/.terraform.lock.hcl') }}

      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Initialise Terraform without the backend
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Generate the image
        run: |
          terraform graph > infrastructure.dot
          dot -Tpng infrastructure.dot -o infrastructure.png

      - name: Upload the image
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: terraform-infrastructure-graph
          path: my-infrastructure/infrastructure.png
          if-no-files-found: error
          retention-days: 30

  comment-on-pr:
    name: Link graph from pull request
    needs: generate-graph

    # Fork pull requests generally do not receive a token that can comment.
    if: github.event.pull_request.head.repo.full_name == github.repository

    runs-on: ubuntu-latest

    permissions:
      pull-requests: write

    steps:
      - name: Add artifact link to pull request
        uses: actions/github-script@v7
        env:
          ARTIFACT_URL: ${{ needs.generate-graph.outputs.artifact-url }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Infrastructure graph: [Download the image](${process.env.ARTIFACT_URL})`
            });
