name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

jobs:
  test:
    name: Test and quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run db:generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Display message
        run: echo "schweet"

  terraform:
    name: Terraform dev
    needs: test
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: terraform-dev-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: my-infrastructure
    env:
      TF_IN_AUTOMATION: "true"
      ARM_USE_OIDC: "true"
      ARM_USE_CLI: "false"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.1
      - name: Initialise Terraform
        run: terraform init -input=false -lockfile=readonly -backend-config="use_cli=false" -backend-config="use_oidc=true"
      - name: Terraform plan dev
        run: terraform plan -input=false -lock-timeout=5m -var-file=dev.tfvars -out="$RUNNER_TEMP/dev.tfplan"
      - name: Verify commit is still main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'heads/main',
            });
            if (data.object.sha !== context.sha) {
              core.setFailed('Refusing to apply an outdated main commit.');
            }
      - name: Terraform apply dev
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform apply -input=false -lock-timeout=5m "$RUNNER_TEMP/dev.tfplan"

  build:
    name: Build container image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ctrl-alt-elite-backend:${{ github.sha }} .
      - name: Save requested PR image
        id: save_pr_image
        if: >-
          github.event_name == 'pull_request' &&
          github.event.action == 'labeled' &&
          github.event.label.name == 'publish-image' &&
          github.event.pull_request.head.repo.full_name == github.repository
        run: |
          docker save --output "$RUNNER_TEMP/pr-image.tar" \
            "ctrl-alt-elite-backend:${{ github.sha }}"

      - name: Upload PR image
        if: steps.save_pr_image.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: pr-image
          path: ${{ runner.temp }}/pr-image.tar
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  release:
    name: Draft release notes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Update draft release
        uses: release-drafter/release-drafter@v6
        with:
          publish: false
          disable-autolabeler: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  scout:
    name: Docker Scout vulnerability scan
    needs: test
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ctrl-alt-elite-backend:${{ github.sha }} .
      - name: Scan image with Docker Scout
        uses: docker/scout-action@v1
        with:
          command: cves
          image: local://ctrl-alt-elite-backend:${{ github.sha }}
          dockerhub-user: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}
          write-comment: false
          summary: true
          exit-code: false

  push:
    name: Publish image to ACR
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID}}
          tenant-id: ${{ vars.AZURE_TENANT_ID}}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID}}
      - name: Log Docker in to ACR
        run: az acr login --name "${{ vars.ACR_CTRL }}"
      - name: Build image for ACR
        run: |
          docker build \
            --tag "${{ vars.ACR_LOGIN_SERVER }}/ctrl-alt-elite-backend:${{ github.sha }}" \
            .
      - name: Push image to ACR
        run: |
          docker push "${{ vars.ACR_LOGIN_SERVER }}/ctrl-alt-elite-backend:${{ github.sha }}"

  update_latest:
    name: Update latest image tag
    needs: push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: acr-backend-main-latest
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID}}
          tenant-id: ${{ vars.AZURE_TENANT_ID}}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID}}

      - name: Log Docker in to ACR
        run: az acr login --name "${{ vars.ACR_CTRL }}"

      - name: Prepare latest image tag
        run: |
          docker pull "${{ vars.ACR_LOGIN_SERVER }}/ctrl-alt-elite-backend:${{ github.sha }}"
          docker tag "${{ vars.ACR_LOGIN_SERVER }}/ctrl-alt-elite-backend:${{ github.sha }}" \
            "${{ vars.ACR_LOGIN_SERVER }}/ctrl-alt-elite-backend:latest"

      - name: Check current main HEAD
        id: main_head
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'heads/main',
            });
            const isCurrent = data.object.sha === context.sha;
            core.setOutput('is_current', isCurrent);
            if (!isCurrent) {
              core.info('Skipping latest: this run no longer matches main HEAD.');
            }

      - name: Push latest image tag
        if: steps.main_head.outputs.is_current == 'true'
        run: docker push "${{ vars.ACR_LOGIN_SERVER }}/ctrl-alt-elite-backend:latest"

  publish_pr:
    name: Publish PR image to ACR
    needs: build
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'publish-image' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download PR image
        uses: actions/download-artifact@v4
        with:
          name: pr-image
          path: ${{ runner.temp }}

      - name: Load PR image
        run: docker load --input "$RUNNER_TEMP/pr-image.tar"

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID}}
          tenant-id: ${{ vars.AZURE_TENANT_ID}}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID}}
      - name: Log Docker in to ACR
        run: az acr login --name "${{ vars.ACR_CTRL }}"

      - name: Tag PR image
        run: |
          docker tag "ctrl-alt-elite-backend:${{ github.sha }}" \
            "${{ vars.ACR_LOGIN_SERVER }}/ctrl-alt-elite-backend:pr-${{ github.event.pull_request.number }}-${{ github.sha }}"

      - name: Push PR image
        run: |
          docker push "${{ vars.ACR_LOGIN_SERVER }}/ctrl-alt-elite-backend:pr-${{ github.event.pull_request.number }}-${{ github.sha }}"

  timing-report:
    name: Timing report
    if: always()
    needs: [test, build, release, scout, push, update_latest, publish_pr]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RUN_API: repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
    steps:
      - name: Write timing report
        run: |
          # Step names must match the names in the "test" job; skipped steps show "unavailable", never 0.
          stage() {
            jq -r --arg label "$1" --arg step "$2" '
              (map(select(.name == "Test and quality checks")) | first) as $job
              | (($job.steps // []) | map(select(.name == $step)) | first) as $s
              | ($s.conclusion // "not finished") as $c
              | (if $c == "success" then "passed"
                 elif $c == "failure" then "failed"
                 elif $s == null then "not found"
                 else $c end) as $status
              | (if $s != null and $c != "skipped" and $s.started_at != null and $s.completed_at != null
                 then "\(($s.completed_at | fromdate) - ($s.started_at | fromdate)) s"
                 else "unavailable" end) as $dur
              | "| \($label) | \($status) | \($dur) |"
            ' "$RUNNER_TEMP/jobs.json"
          }

          {
            echo "## Build timing report"
            echo
            if gh api --paginate "$RUN_API/jobs" --jq '.jobs[]' | jq -s . > "$RUNNER_TEMP/jobs.json"; then
              echo "Stages of the Test and quality checks job, in seconds."
              echo
              echo "| Stage | Result | Duration |"
              echo "|---|---|---|"
              stage "Install dependencies" "Install dependencies"
              stage "Build" "Build"
              stage "Lint" "Lint"
              stage "Test" "Test"
            else
              echo "Stage timings unavailable: could not read job data from the GitHub API."
            fi
            echo
            if elapsed=$(gh api "$RUN_API" --jq '(now - (.run_started_at | fromdate)) | floor'); then
              echo "**Overall elapsed: ${elapsed} s**, measured from workflow start up to this reporting step (the last few seconds of this job are not included)."
            else
              echo "**Overall elapsed:** unavailable."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
