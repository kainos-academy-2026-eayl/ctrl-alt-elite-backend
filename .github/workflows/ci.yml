name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  test:
    name: Test and quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run db:generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Display message
        run: echo "schweet"

  build:
    name: Build container image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ctrl-alt-elite-backend:${{ github.sha }} .
  push:
    name: Publish image to ACR
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID}}
          tenant-id: ${{ vars.AZURE_TENANT_ID}}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID}}
      - name: Log Docker in to ACR
        run: az acr login --name "${{ vars.ACR_CTRL }}"
      - name: Build image for ACR
        run: |
          docker build \
            --tag "${{ vars.ACR_LOGIN_SERVER }}/ctrl-alt-elite-backend:${{ github.sha }}" \
            --tag "${{ vars.ACR_LOGIN_SERVER }}/ctrl-alt-elite-backend:latest" \
            .
      - name: Push image to ACR
        run: |
          docker push "${{ vars.ACR_LOGIN_SERVER }}/ctrl-alt-elite-backend:${{ github.sha }}"
          docker push "${{ vars.ACR_LOGIN_SERVER }}/ctrl-alt-elite-backend:latest"