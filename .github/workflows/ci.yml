name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

jobs:
  test:
    name: Test and quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run db:generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Display message
        run: echo "schweet"

  terraform:
    name: Terraform dev
    needs: test
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: terraform-dev-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: my-infrastructure
    env:
      TF_IN_AUTOMATION: "true"
      ARM_USE_OIDC: "true"
      ARM_USE_CLI: "false"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.1
      - name: Initialise Terraform
        run: terraform init -input=false -lockfile=readonly -backend-config="use_cli=false" -backend-config="use_oidc=true"
      - name: Terraform plan dev
        run: terraform plan -input=false -lock-timeout=5m -var-file=dev.tfvars -out="$RUNNER_TEMP/dev.tfplan"
      - name: Verify commit is still main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'heads/main',
            });
            if (data.object.sha !== context.sha) {
              core.setFailed('Refusing to apply an outdated main commit.');
            }
      - name: Terraform apply dev
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform apply -input=false -lock-timeout=5m "$RUNNER_TEMP/dev.tfplan"

  build:
    name: Build container image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ctrl-alt-elite-backend:${{ github.sha }} .
      - name: Save requested PR image
        id: save_pr_image
        if: >-
          github.event_name == 'pull_request' &&
          github.event.action == 'labeled' &&
          github.event.label.name == 'publish-image' &&
          github.event.pull_request.head.repo.full_name == github.repository
        run: |
          docker save --output "$RUNNER_TEMP/pr-image.tar" \
            "ctrl-alt-elite-backend:${{ github.sha }}"

      - name: Upload PR image
        if: steps.save_pr_image.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: pr-image
          path: ${{ runner.temp }}/pr-image.tar
          if-no-files-found: error
          retention-days: 7
          overwrite: true
  scout:
    name: Docker Scout vulnerability scan
    needs: test
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ctrl-alt-elite-backend:${{ github.sha }} .
      - name: Scan image with Docker Scout
        uses: docker/scout-action@v1
        with:
          command: cves
          image: local://ctrl-alt-elite-backend:${{ github.sha }}
          dockerhub-user: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}
          write-comment: false
          summary: true 
          exit-code: false

  push:
    name: Publish image to ACR
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID}}
          tenant-id: ${{ vars.AZURE_TENANT_ID}}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID}}
      - name: Log Docker in to ACR
        run: az acr login --name "${{ vars.ACR_CTRL }}"
      - name: Build image for ACR
        run: |
          docker build \
            --tag "${{ vars.ACR_LOGIN_SERVER }}/ctrl-alt-https://github.com/kainos-academy-2026-eayl/ctrl-alt-elite-backend/pull/45elite-backend:${{ github.sha }}" \
            .
      - name: Push image to ACR
        run: |
          docker push "${{ vars.ACR_LOGIN_SERVER }}/ctrl-alt-elite-backend:${{ github.sha }}"

  update_latest:
    name: Update latest image tag
    needs: push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: acr-backend-main-latest
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID}}
          tenant-id: ${{ vars.AZURE_TENANT_ID}}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID}}

      - name: Log Docker in to ACR
        run: az acr login --name "${{ vars.ACR_CTRL }}"

      - name: Prepare latest image tag
        run: |
          docker pull "${{ vars.ACR_LOGIN_SERVER }}/ctrl-alt-elite-backend:${{ github.sha }}"
          docker tag "${{ vars.ACR_LOGIN_SERVER }}/ctrl-alt-elite-backend:${{ github.sha }}" \
            "${{ vars.ACR_LOGIN_SERVER }}/ctrl-alt-elite-backend:latest"

      - name: Check current main HEAD
        id: main_head
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'heads/main',
            });
            const isCurrent = data.object.sha === context.sha;
            core.setOutput('is_current', isCurrent);
            if (!isCurrent) {
              core.info('Skipping latest: this run no longer matches main HEAD.');
            }

      - name: Push latest image tag
        if: steps.main_head.outputs.is_current == 'true'
        run: docker push "${{ vars.ACR_LOGIN_SERVER }}/ctrl-alt-elite-backend:latest"

  publish_pr:
    name: Publish PR image to ACR
    needs: build
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'publish-image' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download PR image
        uses: actions/download-artifact@v4
        with:
          name: pr-image
          path: ${{ runner.temp }}

      - name: Load PR image
        run: docker load --input "$RUNNER_TEMP/pr-image.tar"

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID}}
          tenant-id: ${{ vars.AZURE_TENANT_ID}}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID}}
      - name: Log Docker in to ACR
        run: az acr login --name "${{ vars.ACR_CTRL }}"

      - name: Tag PR image
        run: |
          docker tag "ctrl-alt-elite-backend:${{ github.sha }}" \
            "${{ vars.ACR_LOGIN_SERVER }}/ctrl-alt-elite-backend:pr-${{ github.event.pull_request.number }}-${{ github.sha }}"

      - name: Push PR image
        run: |
          docker push "${{ vars.ACR_LOGIN_SERVER }}/ctrl-alt-elite-backend:pr-${{ github.event.pull_request.number }}-${{ github.sha }}"
