name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

categories:
  - title: Features
    labels:
      - feature
      - enhancement

  - title: Bug fixes
    labels:
      - bug

  - title: Documentation
    labels:
      - documentation

version-resolver:
  major:
    labels:
      - breaking-change
  minor:
    labels:
      - feature
      - enhancement
  default: patch

change-template: '- $TITLE (#$NUMBER)'

template: |
  ## What's changed

  $CHANGES
